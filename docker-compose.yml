name: yumetuli

x-laravel-env: &laravel-env
  APP_NAME: ${APP_NAME:-YumeTuli}
  APP_ENV: local
  APP_KEY: ${APP_KEY:?set APP_KEY in .env}
  APP_DEBUG: "true"
  APP_URL: ${APP_URL:-http://localhost:8000}
  APP_LOCALE: ${APP_LOCALE:-en}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-yumetuli}
  DB_USERNAME: ${DB_USERNAME:-yumetuli}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
  QUEUE_CONNECTION: database
  DB_QUEUE_RETRY_AFTER: 6000   # longer than a video run, so a running job is never handed out twice
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: ${REVERB_APP_ID:?set REVERB_APP_ID in .env}
  REVERB_APP_KEY: ${REVERB_APP_KEY:?set REVERB_APP_KEY in .env}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?set REVERB_APP_SECRET in .env}
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: 8080
  REVERB_ALLOWED_ORIGINS: ${WEB_URL:-http://localhost:3000}
  ENGINE_PATH: /engine
  CACHE_STORE: database
  SESSION_DRIVER: database
  LOG_CHANNEL: stderr
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  MEDIA_DISK: ${MEDIA_DISK:-media}
  OWNER_NAME: ${OWNER_NAME:-Owner}
  OWNER_EMAIL: ${OWNER_EMAIL:-}
  OWNER_PASSWORD: ${OWNER_PASSWORD:-}

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-yumetuli}
      MYSQL_USER: ${DB_USERNAME:-yumetuli}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile, target: api }
    image: yumetuli-api
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      <<: *laravel-env
      RUN_MIGRATIONS: "1"
    volumes:
      - ./api:/app
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped
    # Healthy only after migrations ran and the server answers.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 60
    depends_on:
      mysql: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: docker/api.Dockerfile, target: worker }
    image: yumetuli-worker
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      <<: *laravel-env
      # Optional: long-lived token from `claude setup-token` instead of logging in inside the container.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - ./api:/app
      - ./engine:/engine
      - engine-node-modules:/engine/node_modules
      - worker-home:/home/worker
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      api: { condition: service_healthy }

  reverb:
    image: yumetuli-api
    user: "${UID:-1000}:${GID:-1000}"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment: *laravel-env
    volumes:
      - ./api:/app
    ports:
      - "127.0.0.1:${REVERB_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      api: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    image: yumetuli-web
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${APP_URL:-http://localhost:8000}
      NEXT_PUBLIC_REVERB_KEY: ${REVERB_APP_KEY}
      NEXT_PUBLIC_REVERB_HOST: localhost
      NEXT_PUBLIC_REVERB_PORT: ${REVERB_PORT:-8080}
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
      - web-next:/app/.next
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      - api

volumes:
  mysql-data:
  engine-node-modules:
  worker-home:
  web-node-modules:
  web-next:
